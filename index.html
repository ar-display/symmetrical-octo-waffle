<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR鑑賞</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
      color: #1d1d1f;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    p {
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .ar-button {
      display: inline-block;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      background-color: #0071e3;
      border-radius: 980px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }
  </style>
</head>
<body>

  <p id="message">ARを読み込んでいます…<br>自動で開かない場合は下のボタンを押してください。</p>

  <a id="ar-link" href="#" rel="ar" class="ar-button" style="display: none;">
    ARを起動する
  </a>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // URLから ?file= の後ろに指定されたファイル名を取得
      const urlParams = new URLSearchParams(window.location.search);
      const fileName = urlParams.get('file');

      const arLink = document.getElementById('ar-link');
      const message = document.getElementById('message');

      if (fileName) {
        // リンク先に対象のファイル名を設定してボタンを表示
        arLink.href = fileName;
        arLink.style.display = 'inline-block';

        // 自動起動を試行
        setTimeout(() => {
          arLink.click();
        }, 100);
      } else {
        message.textContent = '作品が見つかりません。QRコードを確認してください。';
      }
    });
  </script>

</body>
</html>
