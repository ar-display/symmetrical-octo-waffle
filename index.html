<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR体験</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f7f7f7;
    }
    .ar-button {
      display: inline-block;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #0071e3;
      border-radius: 980px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- rel="ar" を付与することで、iOS SafariがAR Quick Lookとして認識します -->
  <a href="新規プロジェクト 2.usdz" rel="ar" class="ar-button">
    ARを起動する
  </a>
</body>
</html>
