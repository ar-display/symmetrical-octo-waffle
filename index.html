<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR体験</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
      color: #1d1d1f;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    p {
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .ar-button {
      display: inline-block;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      background-color: #0071e3;
      border-radius: 980px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }
  </style>
</head>
<body>

  <p>ARを読み込んでいます…<br>自動で開かない場合は下のボタンを押してください。</p>

  <!-- rel="ar" を付与したリンク -->
  <a id="ar-link" href="work.usdz" rel="ar" class="ar-button">
    ARを起動する
  </a>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const arLink = document.getElementById('ar-link');

      // ページ読み込み完了後、わずかな待ち時間（100ミリ秒）を置いて自動クリックを実行
      setTimeout(() => {
        arLink.click();
      }, 100);
    });
  </script>

</body>
</html>
